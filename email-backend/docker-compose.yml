version: "3.9"
services:
  redis:
    image: redis:7
    container_name: email-backend-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
volumes:
  redis_data: {}
