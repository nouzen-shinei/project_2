<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>You're offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, #1f232c 0%, #111318 55%, #0a0d12 100%);
      font-family: "Poppins", "Segoe UI", Roboto, system-ui, sans-serif;
      color: #e5e7eb;
    }
    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      display: block;
      width: 148px;
      height: 148px;
      border-radius: 34px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
    }
    .status {
      width: 100%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #cbd5e1;
    }
    .status-icon {
      width: 24px;
      height: 24px;
      color: #cbd5e1;
      flex: 0 0 24px;
    }
    .text {
      margin: 0;
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: 0.003em;
    }
    @media (max-width: 480px) {
      .logo {
        width: 160px;
        height: 160px;
        border-radius: 36px;
      }
      .status-icon {
        width: 22px;
        height: 22px;
        flex-basis: 22px;
      }
      .text {
        font-size: 24px;
      }
    }
  </style>
</head>
