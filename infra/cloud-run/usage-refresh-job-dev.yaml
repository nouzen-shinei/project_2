apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: usage-refresh-job-dev
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: usage-refresh-job@tution-app-6c0c3.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: 600
          containers:
            - image: gcr.io/tution-app-6c0c3/backend-runtime@sha256:e4ab7b609daef15e71242e3b4f7481924eaaae3957930300e87fcf14c4dcb425
              command: ["npm"]
              args: ["run", "usage:refresh-worker"]
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
              env:
                - name: NODE_ENV
                  value: production
                - name: FIREBASE_PROJECT_ID
                  value: tution-app-6c0c3
                - name: FIREBASE_DATABASE_URL
                  value: https://tution-app-6c0c3-default-rtdb.asia-southeast1.firebasedatabase.app
                - name: FIREBASE_STORAGE_BUCKET
                  value: tution-app-6c0c3.firebasestorage.app
                - name: ROLLUP_RUNNER_ID
                  value: cloud-run-usage-refresh-job-dev
                - name: USAGE_REFRESH_BATCH_LIMIT
                  value: "1"
                - name: USAGE_REFRESH_DRY_RUN
                  value: "1"
                - name: USAGE_REFRESH_VERBOSE
                  value: "0"
                - name: USAGE_ALERT_UNCHANGED_REMINDER_DAYS
                  value: "14"
                - name: USAGE_ROLLUP_SKIP_REMINDERS
                  value: "1"
                - name: USAGE_ROLLUP_SKIP_PAYMENTS
                  value: "1"
                - name: USAGE_ROLLUP_SKIP_CHAT
                  value: "0"
                - name: USAGE_ROLLUP_SKIP_STORAGE
                  value: "0"

                - name: EMAIL_BACKEND_BASE_URL
                  value: "https://my-email-backend.fly.dev"
                - name: EMAIL_BACKEND_INTERNAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: email-backend-internal-key
                      key: latest
