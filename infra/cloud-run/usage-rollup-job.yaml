apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: usage-rollup-job
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: usage-rollup-job@tution-app-6c0c3.iam.gserviceaccount.com
          maxRetries: 1
          timeoutSeconds: 1800
          containers:
            - image: gcr.io/tution-app-6c0c3/backend-runtime:latest
              command: ["npm"]
              args: ["run", "usage:rollup:scheduled"]
              resources:
                limits:
                  cpu: "1"
                  memory: "512Mi"
              env:
                - name: FIREBASE_PROJECT_ID
                  value: tution-app-6c0c3
                - name: FIREBASE_DATABASE_URL
                  value: https://tution-app-6c0c3-default-rtdb.asia-southeast1.firebasedatabase.app
                - name: FIREBASE_STORAGE_BUCKET
                  value: tution-app-6c0c3.firebasestorage.app
                - name: USAGE_ROLLUP_JOB_LABEL
                  value: prod_daily_rollup
                - name: USAGE_ROLLUP_BACKFILL
                  value: "0"
                - name: USAGE_ROLLUP_MONTH
                  value: ""
                - name: USAGE_ROLLUP_TENANT_IDS
                  value: ""
                - name: USAGE_ROLLUP_DRY_RUN
                  value: "0"
                - name: USAGE_ROLLUP_VERBOSE
                  value: "0"
                - name: USAGE_ROLLUP_SKIP_REMINDERS
                  value: "0"
                - name: USAGE_ROLLUP_SKIP_PAYMENTS
                  value: "0"
                - name: USAGE_ROLLUP_SKIP_CHAT
                  value: "0"
                - name: USAGE_ROLLUP_SKIP_STORAGE
                  value: "0"
