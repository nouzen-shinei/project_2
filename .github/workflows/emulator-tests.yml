name: Firestore Emulator Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Start Firebase Emulators
        run: |
          npx firebase-tools emulators:start --only firestore,database --project demo-project &
          # wait a bit for emulators to boot
          sleep 7
        env:
          FIREBASE_CLI_PRETEND: 'true'

      - name: Wait for emulators
        run: |
          # wait up to 30s for both emulators to be ready
          for i in {1..30}; do
            firestore_ready=0
            rtdb_ready=0

            if nc -z localhost 8080; then
              firestore_ready=1
            fi

            if nc -z localhost 9000; then
              rtdb_ready=1
            fi

            if [ "$firestore_ready" -eq 1 ] && [ "$rtdb_ready" -eq 1 ]; then
              echo "Firestore + RTDB emulators ready"
              break
            fi

            echo "waiting for emulators..."
            sleep 1
          done

          nc -z localhost 8080
          nc -z localhost 9000

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Firestore + RTDB integration harness
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_DATABASE_EMULATOR_HOST: localhost:9000
        run: node scripts/runFirestoreIntegration.js

      - name: Stop Firebase Emulator
        run: |
          # kill background emulator process
          pkill -f "firebase-tools" || true
